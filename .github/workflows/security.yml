# Seguranca: segredos no historico (gitleaks), CodeQL e dependencias novas em PR.
# CodeQL e dependency-review so funcionam de graca em repositorio PUBLICO; em repositorio privado ficam pulados.
# Nao e check obrigatorio: os alertas aparecem na aba Security.
name: security
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
  schedule:
    - cron: "17 6 * * 1"
permissions: { contents: read }
concurrency: { group: "security-${{ github.ref }}", cancel-in-progress: true }

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 } # varre o historico inteiro
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  codeql:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write, actions: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with: { languages: javascript-typescript, build-mode: none }
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with: { category: "/language:javascript-typescript" }

  dependency-review: # so em PR: bloqueia dependencia nova com vulnerabilidade alta
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with: { fail-on-severity: high }
